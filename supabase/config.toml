project_id = "ecohstruqcoictkdcnqf"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[db.migrations]
enabled = true

[auth]
enabled = true
enable_signup = false
site_url = "http://127.0.0.1:8443"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:8443",
]

[auth.email]
enable_signup = false
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true

[storage.vector]
enabled = false
